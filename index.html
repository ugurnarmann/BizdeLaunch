<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bizde - İlan ve Teklifler</title>
  <meta name="description" content="Bizde, Türkiye'nin en kapsamlı ilan ve teklif platformu. İlanlarını ücretsiz yayınla, hızlı teklif al, güvenle alım satım yap." />
  
  <link rel="icon" type="image/png" href="assets/images/bizde_logo_dark.png" />
  <link rel="apple-touch-icon" href="assets/images/bizde_logo_dark.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Exact Material Symbols Rounded font for Flutter 1:1 Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,1,0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Full-Width Top Navigation Bar -->
  <header class="app-header" id="app-header">
    <div class="header-container">
      <div class="header-left">
        <!-- Back button on detail page, hidden on home -->
        <button id="header-back-btn" class="header-icon-btn" style="display: none;" onclick="window.location.hash = '#/'" title="Geri">
          <span class="material-symbols-rounded" style="font-size: 26px;">arrow_back_ios_new</span>
        </button>
      </div>

      <!-- Center: Large Prominent Bizde Logo -->
      <a href="#/" class="logo-link" id="logo-link" title="Bizde Anasayfa">
        <img src="assets/images/bizde_logo_dark.png" alt="Bizde" class="logo-img" />
      </a>

      <!-- Right: Desktop QR / Mobile Download -->
      <div class="header-right">
        <div class="header-qr-badge desktop-only" onclick="openDownloadModal('Uygulamayı İndir')">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://bizde.app/download-app&bgcolor=1E293B&color=F1F5F9" alt="QR" class="header-qr-img" />
          <div class="header-qr-text">
            <span>Uygulamayı İndir</span>
          </div>
        </div>
        <a href="https://bizde.app/download-app" class="btn-download-mobile mobile-only">İndir</a>
      </div>
    </div>
  </header>

  <!-- Main App Viewport Container -->
  <div class="app-viewport">
    <main id="app-root" class="app-main">
      <!-- Initial Shimmer Skeleton -->
      <div class="skeleton-hero shimmer"></div>
      <div class="skeleton-categories">
        <div class="skeleton-cat-item"><div class="skeleton-cat-box shimmer"></div><div class="skeleton-cat-text shimmer"></div></div>
        <div class="skeleton-cat-item"><div class="skeleton-cat-box shimmer"></div><div class="skeleton-cat-text shimmer"></div></div>
        <div class="skeleton-cat-item"><div class="skeleton-cat-box shimmer"></div><div class="skeleton-cat-text shimmer"></div></div>
        <div class="skeleton-cat-item"><div class="skeleton-cat-box shimmer"></div><div class="skeleton-cat-text shimmer"></div></div>
        <div class="skeleton-cat-item"><div class="skeleton-cat-box shimmer"></div><div class="skeleton-cat-text shimmer"></div></div>
      </div>
      <div class="skeleton-section-title shimmer"></div>
      <div class="tenders-list-container">
        <div class="skeleton-card"><div class="skeleton-card-img shimmer"></div><div class="skeleton-card-body"><div class="skeleton-line title shimmer"></div><div class="skeleton-line location shimmer"></div><div class="skeleton-line badge shimmer"></div><div class="skeleton-card-bottom"><div class="skeleton-line meta shimmer"></div><div class="skeleton-line price shimmer"></div></div></div></div>
        <div class="skeleton-card"><div class="skeleton-card-img shimmer"></div><div class="skeleton-card-body"><div class="skeleton-line title shimmer"></div><div class="skeleton-line location shimmer"></div><div class="skeleton-line badge shimmer"></div><div class="skeleton-card-bottom"><div class="skeleton-line meta shimmer"></div><div class="skeleton-line price shimmer"></div></div></div></div>
      </div>
    </main>

    <!-- Floating Action Button (Flutter FAB 1:1) -->
    <button id="fab-add-tender" class="fab-btn" onclick="openDownloadModal('İlan Verme')">
      <span class="material-symbols-rounded" style="font-size: 20px;">add</span>
      <span>İlan Ver</span>
    </button>

    <!-- App Download Modal / Dialog -->
    <div id="download-modal" class="modal-overlay" style="display: none;" onclick="closeDownloadModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <button class="modal-close-btn" onclick="closeDownloadModal()">&times;</button>
        <div class="modal-header">
          <img src="assets/images/bizde_logo_dark.png" alt="Bizde" class="modal-logo" />
          <h3 id="modal-title">Bizde Mobil Uygulaması</h3>
        </div>
        <p class="modal-desc" id="modal-desc">
          Teklif vermek, ilan yayınlamak ve tüm fırsatları yakalamak için Bizde uygulamasını indirin.
        </p>
        <div class="modal-qr-section desktop-only">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://bizde.app/download-app&bgcolor=0F172A&color=F1F5F9" alt="QR Kod" class="modal-qr-img" />
          <span class="modal-qr-hint">Telefonunuzun kamerasıyla QR kodu taratın</span>
        </div>
        <div class="modal-actions">
          <a href="https://bizde.app/download-app" target="_blank" class="modal-btn-download">
            <span class="material-symbols-rounded" style="font-size: 20px;">download</span>
            Uygulamayı İndir
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
